apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-web-page
  namespace: gyumin

spec:
  replicas: 3

  selector:
    matchLabels:
      app: my-web-page

  template:
    metadata:
      labels:
        app: my-web-page

    spec:
      containers:
        - name: my-apache2
          image: rbals8429/ubuntu22.04:my-apache2
          ports:
            - containerPort: 80
