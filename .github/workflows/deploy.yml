name: deploytopypi for release

on:
  push: 
    tags: 
      - 'v*'

jobs:
  build-and-deloy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install dependenties
        run: pip install ruff pytest build setuptools twine

      - name: run ruff
        run: python3 -m ruff check src

      - name: build package
        run: python3 -m build

      - name: deploy to testpypi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST }}
        run: python3 -m twine upload --repository testpypi dist/*
        
  
