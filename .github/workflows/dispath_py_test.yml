name: Python Test

on:
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff
        
      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python3 -m pytest tests
        
      - name: Run ruff
        run: python3 -m ruff check src
